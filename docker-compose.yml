version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: fixlife_frontend
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - fixlife-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.dev
    container_name: fixlife_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  mysql:
    image: mysql:8.0
    container_name: fixlife_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_dev}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 5
      interval: 10s
    networks:
      - fixlife-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fixlife_phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

networks:
  fixlife-network:
    driver: bridge

volumes:
  mysql_data:
