services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_TOMTOM_TRAFFIC_KEY: ${VITE_TOMTOM_TRAFFIC_KEY:-}
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    container_name: fixlife_frontend
    ports:
      - "3000:3000"
    networks:
      - fixlife-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixlife_backend
    env_file:
      - ./.env
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-Info2026/*-}
      - JWT_SECRET=super_secret_jwt_key_for_development
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  mysql:
    image: mysql:8.0
    container_name: fixlife_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Info2026/*-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/fixlife_db.sql:/docker-entrypoint-initdb.d/02_schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 5
      interval: 10s
    networks:
      - fixlife-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fixlife_phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

networks:
  fixlife-network:
    driver: bridge

volumes:
  mysql_data:
