services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
        VITE_ENABLE_GOOGLE_LOGIN: ${VITE_ENABLE_GOOGLE_LOGIN:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_TOMTOM_TRAFFIC_KEY: ${VITE_TOMTOM_TRAFFIC_KEY:-}
        VITE_VIRTUAL_WALLET_CLIENT_ID: ${VITE_VIRTUAL_WALLET_CLIENT_ID:-}
        VITE_VIRTUAL_WALLET_SECRET_KEY: ${VITE_VIRTUAL_WALLET_SECRET_KEY:-}
        VITE_VIRTUAL_WALLET_SCRIPT_URL: ${VITE_VIRTUAL_WALLET_SCRIPT_URL:-}
    container_name: fixlife_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fixlife-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: fixlife_backend
    restart: unless-stopped
    # bind mount below overrides the image's chown, so the non-root image user can't write; root only here, not in prod compose
    user: root
    env_file:
      - ./.env
    command: sh -c "npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=${DB_USER:-fixlife_app}
      - DB_PASSWORD=${DB_PASSWORD:-Info2026/*-}
      - DB_SSL=${DB_SSL:-false}
      - NODE_ENV=development
      - PORT=8000
      - DB_MIGRATIONS_MODE=${DB_MIGRATIONS_MODE:-auto}
      - ENABLE_RUNTIME_SCHEMA_SYNC=${ENABLE_RUNTIME_SCHEMA_SYNC:-false}
      - JWT_SECRET=${JWT_SECRET:-fixlife_dev_only_change_me_please_2026}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - VIRTUAL_WALLET_CLIENT_ID=${VIRTUAL_WALLET_CLIENT_ID:-}
      - VIRTUAL_WALLET_SECRET_KEY=${VIRTUAL_WALLET_SECRET_KEY:-}
      - PLATFORM_FEE_RATE=${PLATFORM_FEE_RATE:-0.12}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://127.0.0.1:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://127.0.0.1:3000}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://127.0.0.1:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@fixlife.site}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      timeout: 10s
      retries: 30
      interval: 5s
      start_period: 240s
    networks:
      - fixlife-network

  mysql:
    image: mysql:8.0
    container_name: fixlife_mysql
    restart: unless-stopped
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-expire-logs-seconds=604800
      --max-binlog-size=100M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Info2026/*-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=${DB_USER:-fixlife_app}
      - DB_PASSWORD=${DB_PASSWORD:-Info2026/*-}
      - BACKUP_DB_PASSWORD=${BACKUP_DB_PASSWORD:-Info2026/*-}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/01_init.sh
      - ./docker/fixlife_db.sql:/docker-entrypoint-initdb.d/02_schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      timeout: 30s
      retries: 30
      interval: 10s
      start_period: 180s
    networks:
      - fixlife-network

  mysql-backup:
    profiles:
      - backup
    build:
      context: ./docker
      dockerfile: Dockerfile.mysql-backup
    container_name: fixlife_mysql_backup
    restart: unless-stopped
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=fixlife_backup
      - MYSQL_PASS=${BACKUP_DB_PASSWORD:-Info2026/*-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
      - MAX_BACKUPS=${BACKUP_RETENTION_DAYS:-14}
      - INIT_BACKUP=1
      - CRON_TIME=0 3 * * *
      - GZIP_LEVEL=6
      - TIMEOUT=60s
      - MYSQLDUMP_OPTS=--single-transaction --no-tablespaces --routines --triggers --events
    volumes:
      - mysql_backups:/backup
      - mysql_data:/var/lib/mysql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fixlife_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  nginx:
    image: nginx:alpine
    container_name: fixlife_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.reverse-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - fixlife-network

  cloudflared:
    profiles:
      - tunnel
    image: cloudflare/cloudflared:latest
    container_name: fixlife_cloudflared
    restart: unless-stopped
    # Quick tunnel: no Cloudflare account/domain needed. Prints a random
    # https://<name>.trycloudflare.com URL to its logs on startup — that URL
    # fronts nginx, which already merges frontend + backend + sockets on :80,
    # so the whole app (including PayPal/cash checkout) works over one origin.
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      nginx:
        condition: service_started
    networks:
      - fixlife-network

networks:
  fixlife-network:
    driver: bridge

volumes:
  mysql_data:
  mysql_backups:
