# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Fixlife-services

on:
  push:
    branches:
      - fullyfull
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: fixlifeserv.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_099FBFD806D8410BBCB0A0411F074867 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_CF5D8B2FD4944B848ACCB5DEE362F6EA }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: fixlifeserv.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_099FBFD806D8410BBCB0A0411F074867 }}/fixlife-frontend:${{ github.sha }}
          file: ./docker/Dockerfile.prod

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    needs: build
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1A83B124B453419C8E579BBAD03E84A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9CC96344E1E84EEEBA5071525514C9C3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2F231CD693D142F6AF366C9384635689 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'Fixlife-services'
          slot-name: 'Production'
          images: 'fixlifeserv.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_099FBFD806D8410BBCB0A0411F074867 }}/fixlife-frontend:${{ github.sha }}'
