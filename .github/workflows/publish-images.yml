name: Test and publish production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fixlife-frontend
            file: docker/Dockerfile.prod
            context: .
          - image: fixlife-backend
            file: backend/Dockerfile
            context: backend
            target: prod
          - image: fixlife-mysql-backup
            file: docker/Dockerfile.mysql-backup
            context: docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ENABLE_GOOGLE_LOGIN=${{ vars.VITE_ENABLE_GOOGLE_LOGIN || 'false' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
            VITE_TOMTOM_TRAFFIC_KEY=${{ vars.VITE_TOMTOM_TRAFFIC_KEY }}
            VITE_VIRTUAL_WALLET_CLIENT_ID=${{ vars.VITE_VIRTUAL_WALLET_CLIENT_ID }}
            VITE_VIRTUAL_WALLET_SECRET_KEY=${{ vars.VITE_VIRTUAL_WALLET_SECRET_KEY }}
            VITE_VIRTUAL_WALLET_SCRIPT_URL=${{ vars.VITE_VIRTUAL_WALLET_SCRIPT_URL }}
