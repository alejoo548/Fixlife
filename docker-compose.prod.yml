services:
  frontend:
    image: ghcr.io/alejoo548/fixlife-frontend:${FIXLIFE_IMAGE_TAG:-latest}
    container_name: fixlife_frontend_prod
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=fixlife_fixlife-network"
      - "traefik.http.routers.fixlife-frontend.rule=Host(`fixlife.site`) || Host(`www.fixlife.site`)"
      - "traefik.http.routers.fixlife-frontend.entrypoints=websecure"
      - "traefik.http.routers.fixlife-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fixlife-frontend.priority=1"
      - "traefik.http.services.fixlife-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fixlife-network

  backend:
    image: ghcr.io/alejoo548/fixlife-backend:${FIXLIFE_IMAGE_TAG:-latest}
    container_name: fixlife_backend_prod
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.5
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=fixlife_fixlife-network"
      - "traefik.http.routers.fixlife-backend.rule=(Host(`fixlife.site`) || Host(`www.fixlife.site`)) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.fixlife-backend.entrypoints=websecure"
      - "traefik.http.routers.fixlife-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fixlife-backend.priority=10"
      - "traefik.http.services.fixlife-backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      timeout: 10s
      retries: 12
      interval: 5s
      start_period: 20s
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=${DB_USER:-fixlife_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-true}
      - NODE_ENV=production
      - PORT=8000
      - DB_MIGRATIONS_MODE=${DB_MIGRATIONS_MODE:-auto}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-live}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - WOMPI_CLIENT_ID=${WOMPI_CLIENT_ID:-}
      - WOMPI_CLIENT_SECRET=${WOMPI_CLIENT_SECRET:-}
      - WOMPI_TOKEN_URL=${WOMPI_TOKEN_URL:-}
      - WOMPI_API_URL=${WOMPI_API_URL:-}
      - PLATFORM_FEE_RATE=${PLATFORM_FEE_RATE:-0.12}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@fixlife.site}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - backend_uploads_prod:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      osrm:
        condition: service_healthy
    networks:
      - fixlife-network

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: fixlife_osrm_prod
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: osrm-routed --algorithm mld /data/el-salvador-latest.osrm
    volumes:
      - ./docker/osrm/data:/data:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && echo -e 'GET /route/v1/driving/-89.2182,13.6929;-89.2724,13.6799 HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 10s
    networks:
      - fixlife-network

  mysql:
    image: mysql:8.0
    container_name: fixlife_mysql_prod
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    labels:
      - "autoheal=true"
    command: >
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-expire-logs-seconds=604800
      --max-binlog-size=100M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=${DB_USER:-fixlife_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - BACKUP_DB_PASSWORD=${BACKUP_DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/01_init.sh
      - ./docker/fixlife_db.sql:/docker-entrypoint-initdb.d/02_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 5
      interval: 10s
    networks:
      - fixlife-network

  mysql-backup:
    image: ghcr.io/alejoo548/fixlife-mysql-backup:${FIXLIFE_IMAGE_TAG:-latest}
    container_name: fixlife_mysql_backup_prod
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=fixlife_backup
      - MYSQL_PASS=${BACKUP_DB_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
      - MAX_BACKUPS=${BACKUP_RETENTION_DAYS:-14}
      - INIT_BACKUP=1
      - CRON_TIME=0 3 * * *
      - GZIP_LEVEL=6
      - TIMEOUT=60s
      - MYSQLDUMP_OPTS=--single-transaction --no-tablespaces --routines --triggers --events --master-data=2
    volumes:
      - mysql_backups_prod:/backup
      - mysql_data_prod:/var/lib/mysql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  # Watches containers labeled autoheal=true and restarts any that Docker
  # marks "unhealthy" (alive but broken) — restart policy alone only
  # covers a crashed/exited container, not a stuck-but-running one.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: fixlife_autoheal_prod
    restart: unless-stopped
    mem_limit: 32m
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  fixlife-network:
    driver: bridge

volumes:
  mysql_data_prod:
  mysql_backups_prod:
  backend_uploads_prod:
