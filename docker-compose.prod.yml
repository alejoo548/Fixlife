services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ENABLE_GOOGLE_LOGIN: ${VITE_ENABLE_GOOGLE_LOGIN:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_TOMTOM_TRAFFIC_KEY: ${VITE_TOMTOM_TRAFFIC_KEY:-}
    container_name: fixlife_frontend_prod
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 15s
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fixlife-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: fixlife_backend_prod
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.5
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      timeout: 10s
      retries: 12
      interval: 5s
      start_period: 20s
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-fixlife_db}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - NODE_ENV=production
      - PORT=8000
      - DB_MIGRATIONS_MODE=${DB_MIGRATIONS_MODE:-auto}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-live}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PLATFORM_FEE_RATE=${PLATFORM_FEE_RATE:-0.12}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fixlife-network

  mysql:
    image: mysql:8.0
    container_name: fixlife_mysql_prod
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    labels:
      - "autoheal=true"
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fixlife_db}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 30s
      retries: 5
      interval: 10s
    networks:
      - fixlife-network

  # Watches containers labeled autoheal=true and restarts any that Docker
  # marks "unhealthy" (alive but broken) — restart policy alone only
  # covers a crashed/exited container, not a stuck-but-running one.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: fixlife_autoheal_prod
    restart: unless-stopped
    mem_limit: 32m
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  fixlife-network:
    driver: bridge

volumes:
  mysql_data_prod:
