user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 ipv6=off valid=30s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # This nginx only ever fronts the cloudflared tunnel (see
        # docker-compose.yml), which always terminates as https at Cloudflare's
        # edge — cloudflared then talks to nginx over plain http locally, so
        # $scheme here is always "http" and would otherwise mislabel every
        # request as insecure, breaking https-only asset URL generation.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        location /api/ {
            proxy_pass http://backend:8000;
        }

        location /uploads/ {
            proxy_pass http://backend:8000;
        }

        location /socket.io/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 3600s;
        }

        location = /health {
            proxy_pass http://backend:8000/api/health;
        }

        # Virtual Wallet's widget only serves over plain http from a LAN-only IP;
        # proxying it here lets the browser load it same-origin https, avoiding
        # mixed-content blocking when the app itself is served over https (tunnel).
        location /vw-widget/ {
            proxy_set_header Host 192.168.3.27:8000;
            proxy_pass http://192.168.3.27:8000/api/v1/widget/;
        }

        # Vite-built assets are content-hashed (index-<hash>.js), so they're
        # safe to cache forever; vite preview itself sends Cache-Control:
        # no-cache, which forces a full re-download of every JS/CSS chunk on
        # every visit over the tunnel's limited residential upload bandwidth.
        location /assets/ {
            proxy_pass http://frontend:3000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://frontend:3000;
        }
    }
}
